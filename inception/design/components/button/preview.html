<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Component preview — Button</title>
<style>
  :root {
    --c-primary: #2563eb;
    --c-primary-hover: #1d4ed8;
    --c-primary-active: #1e40af;
    --c-on-primary: #ffffff;
    --c-bg: #f9fafb;
    --c-surface: #ffffff;
    --c-surface-alt: #f3f4f6;
    --c-border: #e5e7eb;
    --c-text: #111827;
    --c-text-secondary: #4b5563;
    --c-text-disabled: #9ca3af;
    --focus-ring: #2563eb;
    --f-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --t-sm: 0.875rem;
    --t-base: 1rem;
    --fw-medium: 500;
    --fw-semibold: 600;
    --s-1: 0.25rem;
    --s-2: 0.5rem;
    --s-3: 0.75rem;
    --s-4: 1rem;
    --s-6: 1.5rem;
    --r-md: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-primary: #3b82f6;
      --c-primary-hover: #60a5fa;
      --c-primary-active: #93c5fd;
      --c-bg: #0f172a;
      --c-surface: #1e293b;
      --c-surface-alt: #334155;
      --c-border: #475569;
      --c-text: #f8fafc;
      --c-text-secondary: #cbd5e1;
      --c-text-disabled: #64748b;
      --focus-ring: #60a5fa;
    }
  }
  body {
    font-family: var(--f-base);
    background: var(--c-bg);
    color: var(--c-text);
    padding: var(--s-6);
    display: grid;
    gap: var(--s-6);
    max-width: 320px;
  }
  h1 { font-size: var(--t-base); }
  .example h2 {
    font-size: var(--t-sm);
    font-weight: var(--fw-medium);
    color: var(--c-text-secondary);
    margin: 0 0 var(--s-2) 0;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--s-2);
    width: 100%;
    font-family: var(--f-base);
    font-size: var(--t-base);
    font-weight: var(--fw-semibold);
    color: var(--c-on-primary);
    background: var(--c-primary);
    border: none;
    border-radius: var(--r-md);
    padding: var(--s-3) var(--s-4);
    cursor: pointer;
  }
  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .btn.is-hover { background: var(--c-primary-hover); }
  .btn.is-active { background: var(--c-primary-active); }
  .btn.is-loading { background: var(--c-primary-hover); cursor: default; }
  .btn.is-disabled,
  .btn:disabled {
    background: var(--c-surface-alt);
    color: var(--c-text-disabled);
    cursor: not-allowed;
  }
  /*
   * Secondary variant. Added for the password-reset flow: SCR-003/ST-04 offers
   * two real choices at once ("Back to sign in" and "Request a new link"), and
   * two filled buttons side by side tell the employee nothing about which one
   * is the way out.
   */
  .btn-secondary {
    background: var(--c-surface);
    color: var(--c-primary);
    border: 1px solid var(--c-border);
  }
  .btn-secondary.is-hover { background: var(--c-surface-alt); }
  .btn-secondary:disabled,
  .btn-secondary.is-disabled {
    background: var(--c-surface);
    color: var(--c-text-disabled);
  }
  .stack { display: grid; gap: var(--s-2); }
  .spinner {
    width: 1em;
    height: 1em;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: var(--c-on-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>Button</h1>

  <section class="example">
    <h2>Default (enabled)</h2>
    <button class="btn" type="button">Log in</button>
  </section>

  <section class="example">
    <h2>Hover</h2>
    <button class="btn is-hover" type="button">Log in</button>
  </section>

  <!-- @state SCR-001/ST-03 -->
  <section class="example">
    <h2>Loading (submitting)</h2>
    <button class="btn is-loading" type="button" disabled aria-busy="true">
      <span class="spinner" aria-hidden="true"></span>
      <span>Logging in…</span>
    </button>
  </section>

  <!-- @state SCR-002/ST-03 -->
  <section class="example">
    <h2>Loading — sending a reset link</h2>
    <button class="btn is-loading" type="button" disabled aria-busy="true">
      <span class="spinner" aria-hidden="true"></span>
      <span>Sending…</span>
    </button>
  </section>

  <!-- @state SCR-003/ST-07 -->
  <section class="example">
    <h2>Loading — saving a new password</h2>
    <button class="btn is-loading" type="button" disabled aria-busy="true">
      <span class="spinner" aria-hidden="true"></span>
      <span>Saving…</span>
    </button>
  </section>

  <section class="example">
    <h2>Disabled</h2>
    <button class="btn is-disabled" type="button" disabled>Log in</button>
  </section>

  <section class="example">
    <h2>Secondary</h2>
    <button class="btn btn-secondary" type="button">Request a new link</button>
  </section>

  <!--
    Two choices, ranked. SCR-003/ST-04: the employee has already used this link,
    so "Back to sign in" is the likely way out and "Request a new link" is the
    fallback for someone who has forgotten again.
  -->
  <section class="example">
    <h2>Primary + secondary pair</h2>
    <div class="stack">
      <button class="btn" type="button">Back to sign in</button>
      <button class="btn btn-secondary" type="button">Request a new link</button>
    </div>
  </section>

  <!--
    Resend cooldown (part of SCR-002/ST-06). The countdown is in the label
    because a disabled button with no reason reads as broken. The cooldown
    length itself is unresolved — SCR-002/OQ-5, owned by the BA.
  -->
  <section class="example">
    <h2>Secondary, cooling down after a resend</h2>
    <button class="btn btn-secondary is-disabled" type="button" disabled>Send again in 47s</button>
  </section>
</body>
</html>
